[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "langsvg"
version = "0.1.0"
description = "Lang-SVG: hierarchical image vectorization with language priors"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["langsvg*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.txt"]
